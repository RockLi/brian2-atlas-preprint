name: Rebuild manuscript from retained evidence

on:
  push:
    branches: [main]
    paths: ['paper/**', '.github/workflows/manuscript.yml']
  pull_request:
    paths: ['paper/**', '.github/workflows/manuscript.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPL_IGNORE_SYSTEM_FONTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install plotting environment
        run: python -m pip install -r paper/requirements-lock.txt
      - name: Rebuild and check retained-file hashes and reported numbers
        run: python paper/scripts/build_manuscript.py
      - name: Save manuscript and validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manuscript-rebuild
          path: |
            paper/MANUSCRIPT.html
            paper/figures/
            paper/validation/build_report.json
          if-no-files-found: error
